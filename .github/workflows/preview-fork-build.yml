# Preview for PRs from forks, part 1 of 2: build only.
#
# A fork's code is untrusted, so this workflow gets no secrets and a read-only token, and runs on a
# GitHub-hosted runner, never the self-hosted one. It uploads the built site as an artifact;
# preview-fork-deploy.yml picks it up and deploys it without running any code from the PR.
# PRs from branches of this repository use preview.yml instead.
#
# GitHub asks a maintainer to approve the run for first-time contributors
# (Settings → Actions → General → "Approval for running fork pull request workflows").
name: preview-fork-build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: preview-fork-build-${{ github.event.number }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # The same site as production plus drafts
      - name: Build with drafts
        run: SHOW_DRAFTS=1 bun run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-dist
          path: app/dist
          retention-days: 1
          if-no-files-found: error
