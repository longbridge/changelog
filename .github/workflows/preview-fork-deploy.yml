# Preview for PRs from forks, part 2 of 2: deploy what preview-fork-build.yml built.
#
# workflow_run always runs this file as it is on main, with the repository's secrets. So nothing from the
# PR is executed here: the built site is only uploaded, and the PR's content files are only read as data
# by the scripts on main to list the changed versions.
#
# Fork previews go live without a maintainer's review, so anything a fork builds is served on
# pr-<number>.<project>.pages.dev until the PR is closed (preview-cleanup.yml).
# Pages Functions and routing files are removed before the upload, so a preview is static files only.
name: preview-fork-deploy

on:
  workflow_run:
    workflows: [preview-fork-build]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  actions: read

defaults:
  run:
    working-directory: app

jobs:
  # workflow_run doesn't say which PR it was for when the PR comes from a fork, so look it up and only
  # go on while the PR is open and this build is of its latest commit. A build that finishes after the
  # PR was closed, or after a newer push, is not deployed.
  find-pr:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.pr.outputs.number }}
    env:
      GH_TOKEN: ${{ github.token }}
      # Values from the fork go through env, never straight into a script
      HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - id: pr
        working-directory: .
        run: |
          set -euo pipefail
          number=$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f head="$HEAD_OWNER:$HEAD_BRANCH" \
            --jq "map(select(.head.sha == \"$HEAD_SHA\")) | .[0].number // empty")
          [ -z "$number" ] && echo "No open PR has $HEAD_SHA as its latest commit, skipping"
          echo "number=$number" >> "$GITHUB_OUTPUT"

  deploy:
    needs: find-pr
    if: needs.find-pr.outputs.number != ''
    # Handles files from the fork (the built site and the content files), so it stays off the self-hosted runner
    runs-on: ubuntu-latest
    # Shared with preview-cleanup.yml: a cleanup waits for a running deploy, and a deploy that starts
    # after the cleanup checks again that the PR is still open
    concurrency:
      group: preview-pr-${{ needs.find-pr.outputs.number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NUMBER: ${{ needs.find-pr.outputs.number }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check the PR is still open at this commit
        id: open
        working-directory: .
        run: |
          set -euo pipefail
          state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" --jq '"\(.state) \(.head.sha)"')
          if [ "$state" = "open $HEAD_SHA" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "PR is now: $state, skipping"; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.open.outputs.ok == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.open.outputs.ok == 'true'
        with:
          bun-version: 1.3.14
      # Dependencies and scripts from main
      - if: steps.open.outputs.ok == 'true'
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.open.outputs.ok == 'true'
        with:
          name: preview-dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/site
      - name: Keep static files only
        if: steps.open.outputs.ok == 'true'
        run: rm -rf "$RUNNER_TEMP/site/_worker.js" "$RUNNER_TEMP/site/_routes.json" "$RUNNER_TEMP/site/_headers" "$RUNNER_TEMP/site/_redirects" "$RUNNER_TEMP/site/functions"

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.open.outputs.ok == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          packageManager: bun
          command: >-
            pages deploy ${{ runner.temp }}/site
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=pr-${{ needs.find-pr.outputs.number }}
            --commit-hash=${{ github.event.workflow_run.head_sha }}
            --commit-dirty=true

      # The links are listed by the report script on main, over the PR's content files taken as data:
      # they show up as uncommitted changes against main, which is what the report compares.
      # Lines that don't look like the report's own output are dropped, so a fork can't put arbitrary
      # Markdown into the comment: names and versions may only hold letters, digits, spaces and . + -
      # (no bare URLs, #references or @mentions), and every link must point into this preview.
      - name: List changed release pages
        id: links
        if: steps.deploy.outcome == 'success'
        env:
          # grep -P matches the product names (any script) as UTF-8
          LC_ALL: C.UTF-8
          SITE: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          set -uo pipefail
          git fetch --no-tags origin "pull/$NUMBER/head"
          git checkout "$HEAD_SHA" -- src/content/releases src/content/majors || true
          bun run preview:report --base origin/main --site "$SITE" --links "$RUNNER_TEMP/links.md" || true
          {
            echo 'markdown<<LINKS_EOF'
            if grep -qP '^- ' "$RUNNER_TEMP/links.md" 2>/dev/null; then
              echo 'Changed in this PR:'
              echo
              grep -P '^- \*\*[\p{L}\p{N} .+-]+\*\* · ((\[[A-Za-z-]+\]\(\Q'"$SITE"'\E/[A-Za-z0-9/._#-]+\)|~~[A-Za-z-]+~~)( · |$))+$' "$RUNNER_TEMP/links.md" || true
            fi
            echo 'LINKS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Comment preview links
        if: steps.deploy.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: preview
          number: ${{ needs.find-pr.outputs.number }}
          message: |
            ### Preview

            The preview of this PR is ready:
            ${{ steps.deploy.outputs.pages-deployment-alias-url }}

            ${{ steps.links.outputs.markdown }}

            Drafts are included. This link always shows the latest commit of this PR and stops working when the PR is closed.
            This commit only: ${{ steps.deploy.outputs.deployment-url }} (built from ${{ github.event.workflow_run.head_sha }})
