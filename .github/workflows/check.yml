# PR checks: schema, types, assets and locale parity. A PR can't be merged until they pass.
# The preview deployment for each PR is in preview.yml; production deploys on merge, see deploy.yml.
#
# All workflows run on the organization's self-hosted Linux runners for public repositories. To switch, set the
# repository variable LINUX_RUNNER to a JSON runs-on value, e.g. '["public","Linux","X64"]' (default) or '"ubuntu-latest"'.
name: check

on:
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: app

jobs:
  check:
    # This repository is public: PRs from forks run untrusted code (bun install scripts), so they stay on a
    # GitHub-hosted runner and only branches of this repository use the self-hosted one
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && fromJSON(vars.LINUX_RUNNER || '["public","Linux","X64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # check:assets compares assets/ with origin/main to catch replaced files
          fetch-depth: 0
      # The bun cache is shared across runners, and on the public runners a restored cache leaves no bun
      # at ~/.bun/bin. Downloading bun takes a few seconds, so skip the cache
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run check:assets
