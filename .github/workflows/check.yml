# PR checks: schema, types, assets and locale parity. A PR can't be merged until they pass.
# The preview deployment for each PR is in preview.yml; production deploys on merge, see deploy.yml.
name: check

on:
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: app

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check:assets compares assets/ with origin/main to catch replaced files
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run check:assets
