# PR checks: schema, types, assets and locale parity. A PR can't be merged until they pass.
# The preview deployment for each PR is in preview.yml; production deploys on merge, see deploy.yml.
#
# All workflows run on the organization's self-hosted Linux runners. To switch, set the repository variable
# LINUX_RUNNER to a JSON runs-on value, e.g. '["self-hosted","Linux","X64"]' (default) or '"ubuntu-latest"'.
name: check

on:
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: app

jobs:
  check:
    # This repository is public: PRs from forks run untrusted code (bun install scripts), so they stay on a
    # GitHub-hosted runner and only branches of this repository use the self-hosted one
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && fromJSON(vars.LINUX_RUNNER || '["self-hosted","Linux","X64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # check:assets compares assets/ with origin/main to catch replaced files
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run check:assets
