# PR checks: schema, types, assets and locale parity. A PR can't be merged until they pass.
# The preview deployment for each PR is in preview.yml; production deploys on merge, see deploy.yml.
name: check

on:
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: app

jobs:
  check:
    # Fork PRs run untrusted code, so they stay on GitHub-hosted runners; see the note in deploy.yml
    runs-on: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository
      && fromJSON(vars.LINUX_RUNNER || '["self-hosted","Linux","Packager"]')
      || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # check:assets compares assets/ with origin/main to catch replaced files
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run check:assets
