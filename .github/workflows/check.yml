# PR 检查：schema、类型、素材与三语对齐。不过就不能合。
# 只检查、不出预览：预览在本地看（bun run preview:build），合并后才部署到对应环境，见 deploy.yml。
name: check

on:
  pull_request:
    branches: [main, canary]

defaults:
  run:
    working-directory: app

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run check:assets
