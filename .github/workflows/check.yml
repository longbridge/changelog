# PR checks: schema, types, assets and locale parity. A PR can't be merged until they pass.
# Checks only, no preview: preview locally with `bun run preview:build`; deployment happens after merge, see deploy.yml.
name: check

on:
  pull_request:
    branches: [main, canary]

defaults:
  run:
    working-directory: app

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run check:assets
