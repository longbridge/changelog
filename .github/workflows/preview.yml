# Every PR to main gets a preview on Cloudflare Pages, with drafts included, and a sticky comment with the links.
# The URL stays the same for the life of the PR: https://pr-<number>.<project>.pages.dev
# Preview deployments on pages.dev are served with X-Robots-Tag: noindex.
#
# One-time setup in Settings → Secrets and variables → Actions:
#   Secret    CLOUDFLARE_API_TOKEN       API token with the "Cloudflare Pages: Edit" permission
#   Secret    CLOUDFLARE_ACCOUNT_ID
#   Variable  CLOUDFLARE_PAGES_PROJECT   a Direct Upload Pages project, e.g. created with
#                                        bunx wrangler pages project create <name> --production-branch=main
# Without the token the job builds but skips the deployment.
#
# PRs from forks don't get secrets, and PRs opened by the sync workflow with GITHUB_TOKEN
# don't trigger workflows, so neither gets a preview.
name: preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  deployments: write

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # preview:report lists the versions changed against origin/main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build with drafts
        run: |
          SHOW_DRAFTS=1 bun run build
          bun run preview:report --base origin/main
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          packageManager: bun
          command: >-
            pages deploy dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=pr-${{ github.event.number }}
            --commit-hash=${{ github.event.pull_request.head.sha }}
            --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Comment preview links
        if: steps.deploy.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            ### Preview

            | | |
            | --- | --- |
            | Site | ${{ steps.deploy.outputs.pages-deployment-alias-url }}/en/changelog |
            | Review report | ${{ steps.deploy.outputs.pages-deployment-alias-url }}/preview/ |
            | This commit | ${{ steps.deploy.outputs.deployment-url }} |

            The review report lists the versions changed in this PR, with links to each locale. Drafts are included.
            Built from ${{ github.event.pull_request.head.sha }}.
