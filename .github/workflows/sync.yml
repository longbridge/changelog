# 定时抓公开来源 → 生成初稿 → 有变化就开（或更新）一条 PR。
#
# 固定用 sync/releases 分支：上一条没合时会把新内容追加进同一条 PR，不会堆一摞冲突的 PR。
# 只开 PR、不自动合并：初稿要人或 agent 改写成对外口径，三语齐了再转 published。
#
# 用 GITHUB_TOKEN 开的 PR 不会触发其他 workflow（check 不跑）。
# 要在同步 PR 上跑检查，配一个有 contents / pull-requests 写权限的 PAT 到 secrets.SYNC_TOKEN。
name: sync

on:
  schedule:
    # 每天北京时间 11:00
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    working-directory: app

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: 抓取
        env:
          # 只用来提高 GitHub 接口的限额，公开来源匿名也能抓
          RELEASE_NOTES_GH_TOKEN: ${{ github.token }}
        run: bun run fetch
      - name: 生成初稿
        run: bun run transform
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.SYNC_TOKEN || github.token }}
          branch: sync/releases
          base: main
          add-paths: |
            releases
            app/src/content
          commit-message: 'chore(content): 同步上游更新'
          title: 'chore(content): 同步上游更新'
          labels: release-sync
          delete-branch: true
          body: |
            由 sync workflow 自动生成。

            - 非 curated 来源生成的是 `draft` 初稿，需要改写成对外口径才能发
            - 合并到 main 就会上生产，先 PR 到 canary 验收的话从本分支另开一条
