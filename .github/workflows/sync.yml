# Fetch public sources on a schedule → generate first drafts → open (or update) a PR if anything changed.
#
# Always uses the sync/releases branch: if the previous PR isn't merged yet, new content is added to it
# instead of piling up conflicting PRs.
# Opens a PR only, never auto-merges: drafts must be rewritten into public wording by a person or agent,
# and flipped to published once all three locales are ready.
#
# PRs opened with GITHUB_TOKEN don't trigger other workflows (check won't run).
# To run checks on sync PRs, store a PAT with contents / pull-requests write access in secrets.SYNC_TOKEN.
name: sync

on:
  schedule:
    # Daily at 03:00 UTC (11:00 Beijing time)
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    working-directory: app

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Fetch
        env:
          # Only raises the GitHub API rate limit; public sources can be fetched anonymously
          RELEASE_NOTES_GH_TOKEN: ${{ github.token }}
        run: bun run fetch
      - name: Generate drafts
        run: bun run transform
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.SYNC_TOKEN || github.token }}
          branch: sync/releases
          base: main
          add-paths: |
            releases
            app/src/content
          commit-message: 'chore(content): sync upstream release notes'
          title: 'chore(content): sync upstream release notes'
          labels: release-sync
          delete-branch: true
          body: |
            Generated automatically by the sync workflow.

            - Non-curated sources produce `draft` entries that must be rewritten into public wording before publishing
            - Merging into main deploys production; review the Cloudflare Pages preview first
