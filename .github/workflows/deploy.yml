# Merging into main deploys production: longbridge.com/<locale>/changelog.
# Every PR gets its own preview on Cloudflare Pages first, see preview.yml.
#
# Deployment targets are not in the repository; they're configured in Settings:
#   Repository variables   OSS_BUCKET  OSS_ENDPOINT
#   Environment variables  OSS_PREFIX                   on the production environment
#   Credentials            organization-wide FE_LB_ASSET_ACCESS_KEY_* by default;
#                          set OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET on production to override
# The production environment can also require reviewers.
#
# Runners: every workflow here runs on the org's self-hosted Linux runner, because GitHub-hosted runners
# stop starting once the org's spending limit is reached (jobs then sit in "queued" forever).
# LINUX_RUNNER (repository or org variable) takes a JSON array of runner labels and defaults to
# ["self-hosted","Linux","Packager"], the Ubuntu 24.04 machine. The runner group must allow public repositories.
# This repository is public: only jobs that can't run code from a fork use it. preview and notify skip fork
# PRs, and check sends fork PRs to ubuntu-latest.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One upload at a time so two releases can't overwrite each other; new runs queue instead of cancelling
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: app

jobs:
  deploy:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '["self-hosted","Linux","Packager"]') }}
    environment: production
    env:
      OSS_BUCKET: ${{ vars.OSS_BUCKET }}
      OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
      OSS_PREFIX: ${{ vars.OSS_PREFIX }}
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID || secrets.FE_LB_ASSET_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET || secrets.FE_LB_ASSET_ACCESS_KEY_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install ossutil
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSL -o ossutil.zip https://github.com/aliyun/ossutil/releases/download/v1.7.17/ossutil-v1.7.17-linux-amd64.zip
          unzip -qo ossutil.zip
          # Self-hosted runners keep state between jobs and may have no sudo: install into this job's temp dir
          mkdir -p bin
          install ossutil-v1.7.17-linux-amd64/ossutil bin/ossutil
          echo "$PWD/bin" >> "$GITHUB_PATH"
          bin/ossutil --version
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run check:assets
      # Published entries only; assets/ comes along through the public/changelog/assets symlink.
      # deploy verifies asset paths before uploading
      - run: bun run build
      - run: bun run deploy
